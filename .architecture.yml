# Architecture thresholds for tree-sitter-pike
# Adapted for tree-sitter grammar project
# grammar.ts is inherently large due to language complexity

max_file_lines: 800
max_file_lines_hard: 2000

max_function_lines: 80
max_function_lines_hard: 120

ignore_patterns:
  - "grammar.js"
  - "grammar.ts"
  - "src/parser.c"
  - "node_modules/"
  - "bindings/"
  - "*.lock"
  - ".git/"
  - ".github/"
  - ".omp/"

# Rationale: tree-sitter grammar files tend to be large by nature.
# grammar.ts may exceed the soft limit due to language complexity,
# but should not exceed the hard limit.