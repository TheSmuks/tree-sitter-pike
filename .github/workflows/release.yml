name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build grammar
        run: |
          bun build grammar.ts --outfile=grammar.js --target node --format esm
          bunx tree-sitter generate

      - name: Build WASM
        run: |
          bunx tree-sitter build --wasm
          ls -la tree-sitter-pike.wasm
          echo "WASM file size: $(stat -c%s tree-sitter-pike.wasm) bytes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: tree-sitter-pike.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}