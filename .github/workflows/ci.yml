name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install

      - run: bun run check

      - run: bunx tree-sitter generate

      - run: bunx tree-sitter test

      - run: bunx tree-sitter parse examples/*.pike
