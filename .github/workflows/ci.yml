name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install

      - run: bun build grammar.ts --outfile=grammar.js --target node --format esm

      - run: bunx tree-sitter generate

      - run: bunx tree-sitter test

      - run: bunx tree-sitter parse examples/*.pike