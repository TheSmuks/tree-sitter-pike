[package]
name = "tree-sitter-pike"
description = "Pike grammar for tree-sitter"
version = "1.3.3"
authors = ["TheSmuks"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "pike"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/TheSmuks/tree-sitter-pike"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
